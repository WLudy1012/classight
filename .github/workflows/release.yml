name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v1.0.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: classight-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Validate version tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'The tag must use the form vMAJOR.MINOR.PATCH.'
          }
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build release assets
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -Version ($env:RELEASE_TAG.Substring(1))
      - uses: actions/upload-artifact@v4
        with:
          name: classight-release-assets
          path: dist/releases/${{ inputs.tag }}/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: classight-release-assets
          path: release-assets
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [ "$draft" = false ]; then
              echo "Release $RELEASE_TAG is already published."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest

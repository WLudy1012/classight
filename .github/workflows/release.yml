name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v1.0.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: classight-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Validate version tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'The tag must use the form vMAJOR.MINOR.PATCH.'
          }
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build release assets
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -Version ($env:RELEASE_TAG.Substring(1))
      - name: Verify Windows update installation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.1 --repo $env:GITHUB_REPOSITORY --pattern ClassightDaemon-win-x64.exe --pattern ClassightDaemon-win-x64.exe.sha256 --dir dist/update-baseline
          if ($LASTEXITCODE -ne 0) { throw 'Could not download update baseline.' }
          $baseline = 'dist/update-baseline/ClassightDaemon-win-x64.exe'
          $expected = (Get-Content "$baseline.sha256").Split(' ')[0]
          if ((Get-FileHash $baseline).Hash -ne $expected) { throw 'Update baseline checksum mismatch.' }
          ./scripts/Test-WindowsUpdate.ps1 -CurrentExecutable $baseline -NextExecutable "dist/releases/$env:RELEASE_TAG/ClassightDaemon-win-x64.exe"
          if (-not $?) { throw 'Windows update verification failed.' }
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        with:
          name: classight-release-assets
          path: dist/releases/${{ inputs.tag }}/*
          if-no-files-found: error
          compression-level: 0

  linux-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: classight-release-assets
          path: release-assets
      - name: Verify Linux daemon starts
        shell: bash
        run: |
          cd release-assets
          sha256sum --check ClassightDaemon-linux-x64.sha256
          chmod +x ClassightDaemon-linux-x64
          mkdir -p config data/bundle
          printf '{"Urls":"http://127.0.0.1:15080","Updates":{"Enabled":false}}\n' > config/appsettings.json
          DOTNET_BUNDLE_EXTRACT_BASE_DIR="$PWD/data/bundle" ./ClassightDaemon-linux-x64 > daemon.log 2>&1 &
          daemon_pid=$!
          trap 'kill "$daemon_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:15080/health/live > /dev/null; then
              curl --fail --silent http://127.0.0.1:15080/api/v1/setup/status > /dev/null
              test -f plugin/Classight.Blog.dll
              test -f plugin/Classight.Chat.dll
              exit 0
            fi
            sleep 1
          done
          cat daemon.log
          exit 1

  publish:
    needs: [build, linux-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: classight-release-assets
          path: release-assets
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [ "$draft" = false ]; then
              echo "Release $RELEASE_TAG is already published."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
